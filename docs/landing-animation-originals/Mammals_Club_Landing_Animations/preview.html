<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mammals Club animation previews</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeada;color:#302d22;font:16px system-ui;padding:24px}main{max-width:1100px;margin:auto}h1{margin:0 0 8px}p{line-height:1.5}button{padding:10px 20px;border:1px solid #68754f;border-radius:8px;background:#f9f5e9;color:#302d22;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#faf7ef;border:1px solid #d2cfbd;border-radius:16px;overflow:hidden}.card h2{font-size:18px;margin:14px}.stage{height:270px;position:relative;overflow:hidden;background:url(woodland-preview-background.png) center/cover}.sprite{width:180px;height:180px;position:absolute;bottom:20px;left:0;object-fit:contain}.moving{animation:cross 9s linear infinite}.bat{bottom:auto;top:12px;width:150px;height:150px;animation-duration:8s}.hedge{animation-duration:14s}.idle{left:10%;width:220px;height:220px}.paused .moving{animation-play-state:paused}@keyframes cross{from{transform:translateX(-180px)}to{transform:translateX(600px)}}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.moving{animation:none;left:30%}}
</style><main><h1>Mammals Club animation previews</h1><p>Four 12-frame loops. Travel is continuous; illustrated poses play independently. This preview is for assessing assets, not a finished landing page.</p><button id="pause">Pause previews</button><p id="status">Playing</p><div class="grid">
<section class="card"><h2>Squirrel · look and blink</h2><div class="stage"><img class="sprite idle" src="squirrel-idle-preview.webp" alt="Squirrel looking around"></div></section>
<section class="card"><h2>Squirrel · acorn run</h2><div class="stage"><img class="sprite moving" src="squirrel-acorn-run-preview.webp" alt="Squirrel running with an acorn"></div></section>
<section class="card"><h2>Hedgehog · walk</h2><div class="stage"><img class="sprite moving hedge" src="hedgehog-walk-preview.webp" alt="Hedgehog walking"></div></section>
<section class="card"><h2>Bat · wingbeat</h2><div class="stage"><img class="sprite moving bat" src="bat-flight-preview.webp" alt="Bat flying"></div></section>
</div></main><script>
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const images=[...document.querySelectorAll('.sprite')];for(const im of images){im.dataset.loop=im.getAttribute('src');im.dataset.static=im.dataset.loop.replace('-preview.webp','/'+im.dataset.loop.replace('-preview.webp','')+'-01.png')}
function update(){document.body.classList.toggle('paused',paused);for(const im of images)im.src=paused?im.dataset.static:im.dataset.loop;document.querySelector('#pause').textContent=paused?'Play previews':'Pause previews';document.querySelector('#status').textContent=paused?'Paused':'Playing'}
document.querySelector('#pause').onclick=()=>{paused=!paused;update()};update();
</script></html>
